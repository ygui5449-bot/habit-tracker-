<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>习惯追踪</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#f0f2f5;color:#1a1a2e;min-height:100dvh}
.hidden{display:none!important}
.login-page{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:90dvh;padding:24px}
.login-page h1{font-size:48px;margin-bottom:8px}
.login-page .sub{color:#888;margin-bottom:32px;font-size:15px}
.login-box{background:#fff;border-radius:20px;padding:28px 24px;width:100%;max-width:360px;box-shadow:0 2px 12px rgba(0,0,0,.06)}
.login-box input{width:100%;padding:12px 16px;border:1.5px solid #e0e0e0;border-radius:12px;font-size:16px;margin-bottom:12px;outline:none}
.login-box input:focus{border-color:#1a1a2e}
.login-box .btn{width:100%;padding:13px;background:#1a1a2e;color:#fff;border:none;border-radius:12px;font-size:16px;font-weight:600;cursor:pointer;margin-top:4px}
.login-box .btn:active{opacity:.8}
.login-box .switch{text-align:center;margin-top:16px;font-size:14px;color:#888}
.login-box .switch a{color:#1a1a2e;cursor:pointer;font-weight:600}
.login-error{color:#e74c3c;font-size:13px;margin-bottom:8px;text-align:center;min-height:20px}
.app{max-width:800px;margin:0 auto;padding:12px}
.header{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.header .avatar{width:28px;height:28px;border-radius:50%;background:#1a1a2e;color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;flex-shrink:0}
.header .name{font-size:14px;font-weight:600;flex:1}
.header .logout{font-size:12px;color:#888;background:none;border:none;cursor:pointer}
.tabs{display:flex;gap:2px;background:#e8ecf1;border-radius:10px;padding:3px;margin-bottom:12px}
.tabs a{flex:1;padding:8px 2px;border:none;background:transparent;border-radius:8px;font-size:12px;cursor:pointer;color:#666;text-align:center;text-decoration:none;white-space:nowrap}
.tabs a.on{background:#fff;color:#1a1a2e;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.page{display:none}
.page.on{display:block}
.timer-bar{background:#1a1a2e;color:#fff;border-radius:14px;padding:14px 16px;margin-bottom:14px;display:none;align-items:center;gap:10px}
.timer-bar.on{display:flex}
.timer-bar .dot{width:12px;height:12px;border-radius:50%;animation:pulse 1.2s infinite;flex-shrink:0}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.timer-bar .info{flex:1;min-width:0}
.timer-bar .cat{font-size:13px;font-weight:600}
.timer-bar .clock{font-size:26px;font-weight:700}
.timer-bar .stop{padding:10px 18px;border:none;border-radius:10px;background:#e74c3c;color:#fff;font-size:14px;font-weight:600;cursor:pointer}
.cats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.cat{padding:16px 10px;border-radius:14px;cursor:pointer;text-align:center;color:#fff;min-height:90px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;-webkit-tap-highlight-color:transparent}
.cat:active{opacity:.85}
.cat.on{box-shadow:0 0 0 3px rgba(255,255,255,.5);animation:pulse2 1.5s infinite}
@keyframes pulse2{50%{box-shadow:0 0 0 7px rgba(255,255,255,.25)}}
.cat .ic{font-size:28px}
.cat .nm{font-size:14px;font-weight:600}
.cat .td{font-size:11px;opacity:.85}
.cat .rl{font-size:10px;background:rgba(255,255,255,.25);padding:2px 8px;border-radius:8px}
.cat.add{background:#fff;color:#888;border:2px dashed #d0d5dd}
.tl{margin-top:8px}
.tl h3{font-size:15px;margin-bottom:10px;color:#555}
.tl .item{background:#fff;padding:12px 14px;border-radius:12px;margin-bottom:6px;display:flex;align-items:center;gap:10px}
.tl .dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.tl .inf{flex:1;min-width:0}
.tl .cn{font-size:12px;font-weight:600}
.tl .tm{font-size:11px;color:#888}
.tl .ds{font-size:12px;color:#555;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tl .dr{font-weight:600;font-size:13px;flex-shrink:0}
.tl .dl{background:none;border:none;color:#ccc;font-size:16px;padding:2px 6px;cursor:pointer}
.chd{display:flex;align-items:center;gap:6px;margin-bottom:10px}
.chd .dt{flex:1;text-align:center;font-weight:700;font-size:15px}
.chd button{width:32px;height:32px;border:1.5px solid #e0e0e0;border-radius:8px;background:#fff;cursor:pointer;font-size:16px}
.chd .tdy{padding:6px 10px;width:auto;font-size:12px;font-weight:600}
.chd .addc{padding:6px;width:32px;background:#1a1a2e;color:#fff;font-size:18px;border:none;font-weight:700}
.cflex{background:#fff;border-radius:16px 16px 0 0;padding:6px 10px;border-bottom:1px solid #eee}
.cfitem{display:flex;align-items:center;gap:6px;padding:5px 8px;margin:2px 0;border-radius:6px;background:rgba(74,144,217,.07);border-left:3px solid #5cb85c;cursor:pointer;font-size:11px}
.cgrid{background:#fff;border-radius:16px;overflow:hidden}
.chour{display:flex;border-bottom:1px solid #f0f0f0;min-height:44px}
.chlbl{width:36px;padding:3px 4px;font-size:10px;color:#999;text-align:right;flex-shrink:0}
.chcon{flex:1;position:relative;min-height:44px}
.cevt{position:absolute;left:2px;right:2px;border-radius:6px;padding:3px 6px;font-size:10px;color:#fff;overflow:hidden;cursor:pointer;z-index:2}
.cevt.tsk{border:1.5px dashed rgba(255,255,255,.7)}
.ctot{text-align:center;padding:8px;font-size:12px;color:#888}
.plist{display:flex;flex-direction:column;gap:10px}
.pcard{background:#fff;border-radius:14px;padding:14px 16px;cursor:pointer}
.pcard:active{opacity:.9}
.phd{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:8px}
.pttl{font-weight:600;font-size:14px;flex:1}
.pst{font-size:9px;padding:2px 6px;border-radius:8px;font-weight:600}
.pst.a{background:#e3f2fd;color:#1976d2}
.pst.d{background:#e8f5e9;color:#388e3c}
.pst.p{background:#fff3e0;color:#f57c00}
.pbar{height:5px;background:#e0e0e0;border-radius:3px;overflow:hidden;margin-bottom:6px}
.pbar div{height:100%;border-radius:3px}
.pmeta{font-size:10px;color:#999;display:flex;gap:10px;flex-wrap:wrap}
.pdays{display:flex;gap:2px;margin-top:4px}
.pdays span{width:18px;height:18px;border-radius:50%;font-size:9px;display:flex;align-items:center;justify-content:center;background:#e8ecf1;color:#999}
.pdays span.on{background:#1a1a2e;color:#fff}
.srng{display:flex;gap:3px;background:#e8ecf1;border-radius:8px;padding:3px;margin-bottom:16px}
.srng button{flex:1;padding:7px;border:none;background:transparent;border-radius:6px;cursor:pointer;font-size:13px;color:#666}
.srng button.on{background:#fff;color:#1a1a2e;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.ssum{display:flex;gap:8px;margin-bottom:14px}
.ssum .si{flex:1;background:#fff;border-radius:12px;padding:14px;text-align:center}
.ssum .v{font-size:24px;font-weight:700}
.ssum .l{font-size:11px;color:#888}
.cbx{background:#fff;border-radius:14px;padding:16px;margin-bottom:14px}
.cbx h4{font-size:13px;color:#888;margin-bottom:10px}
.cci{position:relative;height:250px}
.cci.bar{height:260px}
.mlist{display:flex;flex-direction:column;gap:6px;margin-bottom:20px}
.mitem{background:#fff;border-radius:12px;padding:12px 14px;display:flex;align-items:center;gap:10px}
.mdot{width:16px;height:16px;border-radius:50%;flex-shrink:0}
.minfo{flex:1}
.minfo .mn{font-weight:600;font-size:14px}
.minfo .mm{font-size:11px;color:#999}
.mbtn{display:flex;gap:4px}
.mbtn button{padding:5px 10px;border-radius:6px;font-size:12px;cursor:pointer;border:1.5px solid #e0e0e0;background:#fff}
.mbtn .del{color:#e74c3c;border-color:#fcc}
.mrow{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}
.btn2{padding:9px 16px;border-radius:8px;background:#fff;border:1.5px solid #e0e0e0;cursor:pointer;font-size:13px}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:100;display:none;align-items:flex-end;justify-content:center}
.overlay.on{display:flex}
.popup{background:#fff;border-radius:20px 20px 0 0;width:100%;max-width:800px;padding:22px 18px 28px;animation:up .25s ease;max-height:85dvh;overflow-y:auto}
@keyframes up{from{transform:translateY(100%)}to{transform:translateY(0)}}
.popup h3{font-size:16px;margin-bottom:14px}
.popup .fg{margin-bottom:14px}
.popup .fg label{display:block;font-size:12px;color:#888;margin-bottom:4px}
.popup .fg input,.popup .fg textarea{width:100%;padding:9px 12px;border:1.5px solid #e0e0e0;border-radius:8px;font-size:14px;outline:none}
.popup .fg textarea{resize:vertical;min-height:50px}
.popup .br{display:flex;gap:8px;margin-top:16px}
.popup .br button{padding:9px 20px;border-radius:8px;font-size:14px;cursor:pointer;border:none;font-weight:600}
.pbtn{background:#1a1a2e;color:#fff;flex:1}
.cbtn{background:#f0f0f0;color:#555}
.dbtn{background:#fff;color:#e74c3c;border:1.5px solid #fcc!important}
.pdet{background:#fff;border-radius:20px 20px 0 0;width:100%;max-width:800px;padding:24px 20px 32px;animation:up .25s ease;max-height:85dvh;overflow-y:auto}
.pdet h3{font-size:16px;margin-bottom:14px}
.pdet .pr{display:flex;gap:8px;align-items:center;margin-bottom:10px;flex-wrap:wrap}
.pdet .pr label{font-size:11px;color:#888;min-width:44px}
.pdet .pr input,.pdet .pr select{flex:1;min-width:80px;padding:7px 10px;border:1.5px solid #e0e0e0;border-radius:8px;font-size:13px;outline:none}
.week-picker{display:flex;gap:4px;flex-wrap:wrap}
.week-picker label{font-size:11px;display:flex;align-items:center;gap:3px;padding:4px 8px;border:1.5px solid #e0e0e0;border-radius:16px;cursor:pointer;background:#fff}
.week-picker label.on{background:#1a1a2e;color:#fff;border-color:#1a1a2e}
.week-picker input{display:none}
.ms-list{display:flex;flex-direction:column;gap:6px;margin-top:6px}
.ms{display:flex;align-items:center;gap:8px;padding:8px 10px;background:#f8f9fa;border-radius:8px;font-size:13px}
.ms.done{opacity:.6;text-decoration:line-through}
.ms input[type=checkbox]{width:18px;height:18px;accent-color:#5cb85c}
.ms .mt{flex:1}
.ms .mx{background:none;border:none;color:#ccc;font-size:16px;padding:2px 6px;cursor:pointer}
.msrow{display:flex;gap:6px;margin-top:8px}
.msrow input{flex:1;padding:7px 10px;border:1.5px dashed #d0d5dd;border-radius:8px;font-size:12px;outline:none}
.msrow button{padding:7px 14px;background:#1a1a2e;color:#fff;border:none;border-radius:8px;font-size:12px;cursor:pointer;font-weight:600}
.ehint{font-size:12px;color:#bbb;text-align:center;padding:20px}
@media(min-width:480px){.tabs a{font-size:14px;padding:9px 4px}}
</style>
</head>
<body>
<div id="loginPage" class="login-page">
<h1>⏱️</h1><div class="sub">习惯时间追踪</div>
<div class="login-box">
<div class="login-error" id="loginError"></div>
<input id="lu" placeholder="用户名" maxlength="30">
<input id="lp" type="password" placeholder="密码" maxlength="50">
<input id="ln" placeholder="昵称（选填）" class="hidden" maxlength="20">
<button class="btn" id="lbtn" type="button" onclick="doLogin()">登 录</button>
<div class="switch"><span id="swText">还没有账户？</span> <a id="swLink" onclick="toggleReg()">立即注册</a></div>
</div></div>

<div id="appMain" class="app hidden">
<div class="header"><div class="avatar" id="avatar"></div><div class="name" id="displayName"></div><button class="logout" type="button" onclick="doLogout()">退出</button></div>
<nav class="tabs">
<a onclick="switchTab('record')" data-tab="record" class="on">记录</a>
<a onclick="switchTab('calendar')" data-tab="calendar">日历</a>
<a onclick="switchTab('stats')" data-tab="stats">统计</a>
<a onclick="switchTab('projects')" data-tab="projects">项目</a>
<a onclick="switchTab('manage')" data-tab="manage">管理</a>
</nav>
<div id="page-record" class="page on">
<div class="timer-bar" id="timerBar"><div class="dot" id="timerDot"></div><div class="info"><div class="cat" id="timerCat"></div><div class="clock" id="timerClock">00:00</div></div><button class="stop" type="button" onclick="stopTimer()">结束</button></div>
<div class="cats" id="catGrid"></div><div class="tl" id="timeline"></div>
</div>
<div id="page-calendar" class="page">
<div class="chd"><button type="button" onclick="calMove(-1)">&lt;</button><div class="dt" id="calTitle"></div><button type="button" onclick="calMove(1)">&gt;</button><button class="tdy" type="button" onclick="calToday()">今天</button><button class="addc" type="button" onclick="calQuickAdd(-1)">+</button></div>
<div class="ctot" id="calTotal"></div><div class="cgrid" id="calGrid"></div><div class="ehint" id="calEmpty">没有记录</div>
</div>
<div id="page-stats" class="page">
<div class="srng" id="statsRange"><button data-range="day" class="on">日</button><button data-range="week">周</button><button data-range="month">月</button><button data-range="year">年</button></div>
<div class="ssum" id="statsSummary"></div><div class="cbx"><h4>时间占比</h4><div class="cci"><canvas id="pieC"></canvas></div></div>
<div class="cbx"><h4>各分类时长</h4><div class="cci bar"><canvas id="barC"></canvas></div></div>
</div>
<div id="page-projects" class="page">
<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px"><h3 style="font-size:15px">我的项目</h3><button class="btn2" type="button" onclick="openProject()" style="font-size:12px;padding:7px 12px">+ 新建</button></div>
<div class="plist" id="projList"></div>
</div>
<div id="page-manage" class="page">
<div style="font-size:14px;font-weight:600;margin-bottom:10px;color:#555">我的模块</div>
<div class="mlist" id="catList"></div>
<div class="mrow"><button class="pbtn" type="button" onclick="openCat()" style="flex:inherit;padding:9px 20px">+ 添加模块</button><button class="btn2" type="button" onclick="exportAll()">导出</button><button class="btn2" type="button" onclick="document.getElementById('importFile').click()">导入</button></div>
<input type="file" id="importFile" accept=".json" style="display:none" onchange="importAll(event)">
</div></div>

<div class="overlay" id="stopOverlay" onclick="if(event.target===this)closeStop()"><div class="popup">
<h3 id="stopTitle"></h3><div style="font-size:22px;font-weight:700;text-align:center;margin-bottom:14px" id="stopDur"></div><div style="font-size:12px;color:#999;text-align:center;margin-bottom:10px" id="stopTime"></div>
<div class="fg"><label>做了什么</label><textarea id="stopDesc"></textarea></div>
<div class="br"><button class="dbtn" type="button" onclick="closeStop()">丢弃</button><button class="pbtn" type="button" onclick="saveStop()">保存</button></div>
</div></div>

<div class="overlay" id="catOverlay" onclick="if(event.target===this)closeCat()"><div class="popup">
<h3 id="catTitle">添加模块</h3>
<div class="fg"><label>名称</label><input id="catName"></div><div class="fg"><label>图标</label><input id="catIcon" placeholder="📌"></div>
<div class="fg"><label>颜色</label><input type="color" id="catColor" value="#4a90d9" style="height:36px;width:100%;padding:3px"></div>
<div class="br"><button class="pbtn" type="button" onclick="saveCat()">保存</button><button class="cbtn" type="button" onclick="closeCat()">取消</button></div>
</div></div>

<div class="overlay" id="cardOverlay" onclick="if(event.target===this)closeCard()"><div class="popup" style="text-align:center">
<h3 id="cardTitle"></h3>
<div style="display:flex;gap:12px;margin-top:16px">
<button type="button" onclick="cardTimer()" style="flex:1;padding:20px;border-radius:14px;border:1.5px solid #e0e0e0;background:#fff;cursor:pointer;font-size:16px">计时<br><span style="font-size:12px;color:#888">完成后自动记录</span></button>
<button type="button" onclick="cardAdd()" style="flex:1;padding:20px;border-radius:14px;border:1.5px solid #e0e0e0;background:#fff;cursor:pointer;font-size:16px">添加时段<br><span style="font-size:12px;color:#888">直接填写时间</span></button>
</div>
<button type="button" onclick="closeCard()" style="margin-top:14px;padding:8px 24px;border-radius:8px;border:none;background:#f0f0f0;cursor:pointer">取消</button>
</div></div>

<div class="overlay" id="calOverlay" onclick="if(event.target===this)closeCalAdd()"><div class="popup">
<h3>添加日程</h3>
<div class="fg"><label>模块</label><div id="calCatPick" style="display:flex;gap:6px;flex-wrap:wrap"></div></div>
<div class="pr"><label>开始</label><input type="datetime-local" id="calStart"> <label>结束</label><input type="datetime-local" id="calEnd"></div>
<div class="fg"><label>描述</label><textarea id="calDesc" style="min-height:40px"></textarea></div>
<div class="br"><button class="cbtn" type="button" onclick="closeCalAdd()">取消</button><button class="pbtn" type="button" onclick="saveCalAdd()">保存</button></div>
</div></div>

<div class="overlay" id="projOverlay" onclick="if(event.target===this)closeProject()"><div class="pdet" id="projDetail"></div></div>

<script>
var isReg=false,USER=null,cats=[],recs=[],projs=[],activeRange='day',editCatId=null,pieC=null,barC=null,timer=null,timerInt=null,calDate=new Date(),editPid=null;
var PRESETS=[{n:'学英语',i:'📖',c:'#4a90d9'},{n:'运动',i:'🏃',c:'#5cb85c'},{n:'读书',i:'📚',c:'#9b59b6'},{n:'做实验',i:'🔬',c:'#f0ad4e'},{n:'学习',i:'✏️',c:'#20b2aa'},{n:'工作',i:'💼',c:'#e74c3c'}];
var WKD=['一','二','三','四','五','六','日'],PCL=['#4a90d9','#5cb85c','#9b59b6','#f0ad4e','#20b2aa','#e74c3c','#ff6b8a','#607d8b'];
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function fmtd(ms){if(ms<=0)return'0分';var h=Math.floor(ms/3600000),m=Math.round((ms%3600000)/60000);return h>0?h+'小时'+(m>0?m+'分':''):m+'分钟'}
function fmts(ms){var h=Math.floor(ms/3600000),m=Math.round((ms%3600000)/60000);return h>0?h+'h'+(m>0?m+'m':''):m+'m'}
function fmtt(iso){if(!iso)return'';var d=new Date(iso);return(d.getMonth()+1)+'/'+d.getDate()+' '+('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2)}
function fmtc(ms){var s=Math.floor(ms/1000),h=Math.floor(s/3600),m=Math.floor((s%3600)/60),sec=s%60;return(h>0?h+':'+('0'+m).slice(-2):('0'+m).slice(-2))+':'+('0'+sec).slice(-2)}
function esc(s){var d=document.createElement('div');d.textContent=s;return d.innerHTML}
function grd(r){var n=new Date(),s=new Date();switch(r){case'day':s.setHours(0,0,0,0);break;case'week':var d=n.getDay()||7;s.setDate(n.getDate()-d+1);s.setHours(0,0,0,0);break;case'month':s.setDate(1);s.setHours(0,0,0,0);break;case'year':s.setMonth(0,1);s.setHours(0,0,0,0);break}return{st:s.getTime(),et:n.getTime()}}
function L(k,f){try{var v=localStorage.getItem(k);return v?JSON.parse(v):f}catch(e){return f}}
function S(k,v){localStorage.setItem(k,JSON.stringify(v))}
function uK(k){return'ht_'+USER.username+'_'+k}
function hpw(p){var h=0,s='ht_'+p;for(var i=0;i<s.length;i++){h=((h<<5)-h)+s.charCodeAt(i);h|=0}return'ht_'+Math.abs(h).toString(36)}

function doLogin(){
  var u=document.getElementById('lu').value.trim(),p=document.getElementById('lp').value,n=document.getElementById('ln').value.trim(),e=document.getElementById('loginError');
  if(!u||!p){e.textContent='请填写用户名和密码';return}
  if(u.length<2){e.textContent='用户名至少2个字符';return}
  if(p.length<3){e.textContent='密码至少3个字符';return}
  var h=hpw(p),users=L('ht_users',{});
  if(isReg){if(users[u]){e.textContent='用户名已存在';return}users[u]={pw:h,nick:n||u};S('ht_users',users);enter(u,n||u)}
  else{var ud=users[u];if(!ud){e.textContent='用户不存在';return}if(ud.pw!==h){e.textContent='密码错误';return}enter(u,ud.nick)}

function saveCat(){var nm=document.getElementById('catName').value.trim(),ic=document.getElementById('catIcon').value.trim()||'📌',cl=document.getElementById('catColor').value;if(!nm)return alert('请输入名称');if(editCatId){var c=cats.find(function(x){return x.id===editCatId});if(c){c.name=nm;c.icon=ic;c.color=cl}}else{cats.push({id:uid(),name:nm,icon:ic,color:cl,preset:false})}S(uK('cats'),cats);closeCat();renderAll()}
function editCat(id){openCat(id)}
function delCat(id){var c=cats.find(function(x){return x.id===id});if(!c||c.preset)return;if(!confirm('删除"'+c.name+'"？'))return;cats=cats.filter(function(x){return x.id!==id});S(uK('cats'),cats);renderAll()}
function exportAll(){var d={cats:cats,recs:recs,projs:projs};var b=new Blob([JSON.stringify(d)],{type:'application/json'});var a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='habit-'+new Date().toISOString().slice(0,10)+'.json';a.click()}
function importAll(e){var f=e.target.files[0];if(!f)return;var r=new FileReader();r.onload=function(ev){try{var d=JSON.parse(ev.target.result);if(d.cats)cats=d.cats;if(d.recs)recs=d.recs;if(d.projs)projs=d.projs;S(uK('cats'),cats);S(uK('recs'),recs);S(uK('projs'),projs);renderAll();alert('导入成功！')}catch(err){alert('导入失败')}};r.readAsText(f);e.target.value=''}

function switchTab(tab){document.querySelectorAll('.tabs a').forEach(function(b){b.classList.toggle('on',b.dataset.tab===tab)});document.querySelectorAll('.page').forEach(function(p){p.classList.toggle('on',p.id==='page-'+tab)});if(tab==='stats')renderStats();if(tab==='manage')renderCatList();if(tab==='calendar')renderCal();if(tab==='projects')renderProjs()}
document.querySelectorAll('#statsRange button').forEach(function(b){b.addEventListener('click',function(){document.querySelectorAll('#statsRange button').forEach(function(x){x.classList.remove('on')});b.classList.add('on');activeRange=b.dataset.range;renderStats()})});
document.addEventListener('keydown',function(e){if(e.key==='Escape'){if(document.getElementById('stopOverlay').classList.contains('on'))closeStop();if(document.getElementById('catOverlay').classList.contains('on'))closeCat();if(document.getElementById('projOverlay').classList.contains('on'))closeProject();if(document.getElementById('calOverlay').classList.contains('on'))closeCalAdd();if(document.getElementById('cardOverlay').classList.contains('on'))closeCard()}});
(function(){var su=sessionStorage.getItem('ht_u');if(su){try{USER=JSON.parse(su);document.getElementById('loginPage').classList.add('hidden');document.getElementById('appMain').classList.remove('hidden');document.getElementById('avatar').textContent=(USER.nickname||USER.username)[0].toUpperCase();document.getElementById('displayName').textContent=USER.nickname||USER.username;initApp()}catch(e){USER=null}}})()
</script>
</body>
</html>
