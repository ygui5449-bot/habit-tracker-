<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<title>习惯追踪</title>
<meta name="theme-color" content="#1a1a2e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="习惯追踪">
<link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect fill='%231a1a2e' width='100' height='100' rx='20'/><text x='50' y='68' text-anchor='middle' font-size='55'>⏱</text></svg>">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#f0f2f5;color:#1a1a2e;min-height:100dvh;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}
.app{max-width:800px;margin:0 auto;padding:16px}

.auth-screen{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:90dvh;padding:24px}
.auth-screen h1{font-size:48px;margin-bottom:8px}
.auth-screen .subtitle{color:#888;margin-bottom:32px;font-size:15px}
.auth-card{background:#fff;border-radius:20px;padding:28px 24px;width:100%;max-width:380px;box-shadow:0 2px 12px rgba(0,0,0,.06)}
.auth-card input{width:100%;padding:12px 16px;border:1.5px solid #e0e0e0;border-radius:12px;font-size:16px;margin-bottom:12px;outline:none;font-family:inherit}
.auth-card input:focus{border-color:#1a1a2e}
.auth-card .btn-auth{width:100%;padding:13px;background:#1a1a2e;color:#fff;border:none;border-radius:12px;font-size:16px;font-weight:600;cursor:pointer;margin-top:4px}
.auth-card .btn-auth:disabled{opacity:.5}
.auth-card .switch-mode{text-align:center;margin-top:16px;font-size:14px;color:#888}
.auth-card .switch-mode a{color:#1a1a2e;cursor:pointer;font-weight:600;text-decoration:underline}
.auth-error{color:#e74c3c;font-size:13px;margin-bottom:8px;text-align:center;min-height:20px}
.hidden{display:none!important}

.tab-nav{display:flex;gap:2px;background:#e8ecf1;border-radius:10px;padding:3px;margin-bottom:12px;position:sticky;top:16px;z-index:10;overflow-x:auto}
.tab-btn{flex:1;padding:7px 2px;border:none;background:transparent;border-radius:8px;font-size:12px;cursor:pointer;color:#666;transition:.2s;font-weight:500;white-space:nowrap;min-width:0}
.tab-btn.active{background:#fff;color:#1a1a2e;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.user-menu{display:flex;align-items:center;gap:8px;margin-bottom:12px;padding:0 4px}
.user-avatar{width:28px;height:28px;border-radius:50%;background:#1a1a2e;color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;flex-shrink:0}
.user-name{font-size:14px;font-weight:600;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.btn-logout{font-size:12px;color:#888;background:none;border:none;cursor:pointer;padding:4px 8px;white-space:nowrap}
.sync-status{font-size:10px;display:flex;align-items:center;gap:3px;white-space:nowrap}
.sync-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.sync-dot.online{background:#5cb85c}
.sync-dot.offline{background:#f0ad4e}
.sync-dot.syncing{background:#4a90d9;animation:pulse 1s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.offline-banner{background:#fff3cd;color:#856404;padding:6px 12px;border-radius:8px;font-size:12px;text-align:center;margin-bottom:12px;display:none}
.offline-banner.show{display:block}

.panel{display:none}
.panel.active{display:block}

.running-banner{background:#1a1a2e;color:#fff;border-radius:14px;padding:14px 16px;margin-bottom:14px;display:none;align-items:center;gap:10px}
.running-banner.show{display:flex}
.running-banner .rb-dot{width:12px;height:12px;border-radius:50%;animation:pulse 1.2s infinite;flex-shrink:0}
.rb-info{flex:1;min-width:0}
.rb-cat{font-size:13px;font-weight:600}
.rb-timer{font-size:26px;font-weight:700;font-variant-numeric:tabular-nums}
.rb-stop{padding:10px 18px;border:none;border-radius:10px;background:#e74c3c;color:#fff;font-size:14px;font-weight:600;cursor:pointer;white-space:nowrap;flex-shrink:0}

.cat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.cat-card{padding:16px 10px;border-radius:14px;cursor:pointer;text-align:center;color:#fff;transition:transform .15s;position:relative;min-height:90px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;user-select:none;-webkit-tap-highlight-color:transparent}
.cat-card:active{transform:scale(.97)}
.cat-card.running{box-shadow:0 0 0 3px rgba(255,255,255,.5);animation:rPulse 1.5s infinite}
@keyframes rPulse{0%,100%{box-shadow:0 0 0 3px rgba(255,255,255,.5)}50%{box-shadow:0 0 0 7px rgba(255,255,255,.25)}}
.cat-icon{font-size:28px;line-height:1}
.cat-name{font-size:14px;font-weight:600}
.cat-today{font-size:11px;opacity:.85;margin-top:1px}
.cat-running-label{font-size:10px;margin-top:1px;opacity:.9;background:rgba(255,255,255,.25);padding:2px 8px;border-radius:8px}
.add-card{background:#fff;color:#888;border:2px dashed #d0d5dd;min-height:90px;display:flex;align-items:center;justify-content:center;gap:6px;font-size:14px}

.cal-header{display:flex;align-items:center;gap:6px;margin-bottom:10px}
.cal-header .date-title{flex:1;text-align:center;font-weight:700;font-size:15px}
.cal-header button{width:32px;height:32px;border:1.5px solid #e0e0e0;border-radius:8px;background:#fff;cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.cal-header .btn-today{padding:6px 10px;width:auto;font-size:12px;font-weight:600}
.cal-header .btn-addcal{padding:6px;width:32px;background:#1a1a2e;color:#fff;font-size:18px;border:none;font-weight:700}
.cal-flex-tasks{background:#fff;border-radius:16px 16px 0 0;padding:6px 10px;border-bottom:1px solid #eee}
.cal-flex-item{display:flex;align-items:center;gap:6px;padding:5px 8px;margin:2px 0;border-radius:6px;background:rgba(74,144,217,.07);border-left:3px solid #5cb85c;cursor:pointer;font-size:11px}
.cal-grid{background:#fff;border-radius:16px;overflow:hidden}
.cal-hour{display:flex;border-bottom:1px solid #f0f0f0;min-height:44px;position:relative}
.cal-hour-label{width:36px;padding:3px 4px;font-size:10px;color:#999;text-align:right;flex-shrink:0;line-height:1.2}
.cal-hour-content{flex:1;position:relative;min-height:44px}
.cal-event{position:absolute;left:2px;right:2px;border-radius:6px;padding:3px 6px;font-size:10px;color:#fff;overflow:hidden;cursor:pointer;z-index:2}
.cal-event.task-event{border:1.5px dashed rgba(255,255,255,.7);background:rgba(26,26,46,.75)}
.cal-event .ev-title{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:10px}
.cal-event .ev-time{opacity:.8;font-size:9px}
.cal-empty{color:#ddd;font-size:12px;text-align:center;padding:30px}
.cal-day-total{text-align:center;padding:8px;font-size:12px;color:#888}

.proj-list{display:flex;flex-direction:column;gap:10px}
.proj-card{background:#fff;border-radius:14px;padding:14px 16px;cursor:pointer;transition:transform .1s}
.proj-card:active{transform:scale(.99)}
.proj-header{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:8px}
.proj-title{font-weight:600;font-size:14px;flex:1}
.proj-status{font-size:9px;padding:2px 6px;border-radius:8px;font-weight:600;white-space:nowrap}
.p-status.active{background:#e3f2fd;color:#1976d2}
.p-status.done{background:#e8f5e9;color:#388e3c}
.p-status.paused{background:#fff3e0;color:#f57c00}
.proj-bar{height:5px;background:#e0e0e0;border-radius:3px;overflow:hidden;margin-bottom:6px}
.proj-bar-fill{height:100%;border-radius:3px;transition:width .3s}
.proj-meta{font-size:10px;color:#999;display:flex;gap:10px;flex-wrap:wrap}
.proj-meta span{white-space:nowrap}
.proj-freq{display:flex;gap:2px;margin-top:4px}
.proj-freq .d{width:18px;height:18px;border-radius:50%;font-size:9px;display:flex;align-items:center;justify-content:center;background:#e8ecf1;color:#999}
.proj-freq .d.on{background:#1a1a2e;color:#fff}

.proj-detail{background:#fff;border-radius:20px 20px 0 0;width:100%;max-width:800px;padding:24px 20px 32px;animation:slideUp .25s ease;max-height:85dvh;overflow-y:auto}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.proj-detail h3{font-size:16px;margin-bottom:14px}
.proj-detail .pr{display:flex;gap:8px;align-items:center;margin-bottom:10px;flex-wrap:wrap}
.proj-detail .pr label{font-size:11px;color:#888;min-width:44px;font-weight:500}
.proj-detail .pr input,.proj-detail .pr select{flex:1;min-width:80px;padding:7px 10px;border:1.5px solid #e0e0e0;border-radius:8px;font-size:13px;font-family:inherit;outline:none}
.proj-detail .pr input:focus{border-color:#4a90d9}
.day-picker{display:flex;gap:4px;flex-wrap:wrap}
.day-picker label{font-size:11px;display:flex;align-items:center;gap:3px;padding:4px 8px;border:1.5px solid #e0e0e0;border-radius:16px;cursor:pointer;background:#fff;transition:.15s}
.day-picker label.on{background:#1a1a2e;color:#fff;border-color:#1a1a2e}
.day-picker input{display:none}
.milestone-list{display:flex;flex-direction:column;gap:6px;margin-top:6px}
.milestone-item{display:flex;align-items:center;gap:8px;padding:8px 10px;background:#f8f9fa;border-radius:8px;font-size:13px}
.milestone-item.done{opacity:.6;text-decoration:line-through}
.milestone-item input[type="checkbox"]{width:18px;height:18px;cursor:pointer;accent-color:#5cb85c}
.milestone-item .ms-title{flex:1}
.milestone-del{background:none;border:none;color:#ccc;cursor:pointer;font-size:16px;padding:2px 6px}
.milestone-del:hover{color:#e74c3c}
.add-ms-row{display:flex;gap:6px;margin-top:8px}
.add-ms-row input{flex:1;padding:7px 10px;border:1.5px dashed #d0d5dd;border-radius:8px;font-size:12px;outline:none}
.add-ms-row button{padding:7px 14px;background:#1a1a2e;color:#fff;border:none;border-radius:8px;font-size:12px;cursor:pointer;font-weight:600;white-space:nowrap}

.timeline{margin-top:8px}
.timeline h3{font-size:15px;margin-bottom:10px;color:#555}
.tl-item{background:#fff;padding:12px 14px;border-radius:12px;margin-bottom:6px;display:flex;align-items:center;gap:10px}
.tl-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.tl-info{flex:1;min-width:0}
.tl-cat{font-size:12px;font-weight:600}
.tl-time{font-size:11px;color:#888;margin-top:1px}
.tl-desc{font-size:12px;color:#555;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tl-duration{font-weight:600;font-size:13px;color:#1a1a2e;flex-shrink:0}
.tl-del{background:none;border:none;color:#ccc;cursor:pointer;font-size:16px;padding:2px 6px}
.tl-del:hover{color:#e74c3c}

.stats-range{display:flex;gap:3px;background:#e8ecf1;border-radius:8px;padding:3px;margin-bottom:16px}
.stats-range button{flex:1;padding:7px;border:none;background:transparent;border-radius:6px;cursor:pointer;font-size:13px;color:#666;font-weight:500}
.stats-range button.active{background:#fff;color:#1a1a2e;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.stats-charts{display:flex;flex-direction:column;gap:14px}
.chart-box{background:#fff;border-radius:14px;padding:16px}
.chart-box h4{font-size:13px;color:#888;margin-bottom:10px}
.chart-inner{position:relative;height:250px}
.chart-inner.bar{height:260px}
.stats-summary{display:flex;gap:8px;margin-bottom:14px}
.stat-item{flex:1;background:#fff;border-radius:12px;padding:14px;text-align:center}
.stat-item .val{font-size:24px;font-weight:700}
.stat-item .lbl{font-size:11px;color:#888;margin-top:3px}

.section-title{font-size:14px;font-weight:600;margin-bottom:10px;color:#555}
.cat-list{display:flex;flex-direction:column;gap:6px;margin-bottom:20px}
.cat-item{background:#fff;border-radius:12px;padding:12px 14px;display:flex;align-items:center;gap:10px}
.cat-color{width:16px;height:16px;border-radius:50%;flex-shrink:0}
.cat-info{flex:1}
.cat-info .name{font-weight:600;font-size:14px}
.cat-info .meta{font-size:11px;color:#999}
.cat-actions{display:flex;gap:4px}
.cat-actions button{padding:5px 10px;border-radius:6px;font-size:12px;cursor:pointer;border:1.5px solid #e0e0e0;background:#fff}
.cat-actions .btn-del{color:#e74c3c;border-color:#fcc}
.btn-row-manage{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}
.btn-secondary{padding:9px 16px;border-radius:8px;background:#fff;border:1.5px solid #e0e0e0;cursor:pointer;font-size:13px}
.btn-secondary:hover{background:#f5f5f5}

.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:100;display:none;align-items:flex-end;justify-content:center}
.modal-overlay.show{display:flex}
.modal{background:#fff;border-radius:20px 20px 0 0;width:100%;max-width:800px;padding:22px 18px 28px;animation:slideUp .25s ease;max-height:85dvh;overflow-y:auto}
.modal h3{font-size:16px;margin-bottom:14px;display:flex;align-items:center;gap:6px}
.modal h3 .cat-dot{width:10px;height:10px;border-radius:50%;display:inline-block}
.modal-duration{font-size:22px;font-weight:700;text-align:center;margin-bottom:14px;color:#1a1a2e}
.form-group{margin-bottom:14px}
.form-group label{display:block;font-size:12px;color:#888;margin-bottom:4px;font-weight:500}
.form-group input,.form-group textarea{width:100%;padding:9px 12px;border:1.5px solid #e0e0e0;border-radius:8px;font-size:14px;font-family:inherit;outline:none}
.form-group input:focus,.form-group textarea:focus{border-color:#4a90d9}
.form-group textarea{resize:vertical;min-height:50px}
.modal-time-info{font-size:12px;color:#999;text-align:center;margin-bottom:10px}
.btn-row{display:flex;gap:8px;margin-top:16px}
.btn-primary,.btn-cancel,.btn-discard{padding:9px 20px;border-radius:8px;font-size:14px;cursor:pointer;border:none;font-weight:600}
.btn-primary{background:#1a1a2e;color:#fff;flex:1}
.btn-cancel{background:#f0f0f0;color:#555}
.btn-discard{background:#fff;color:#e74c3c;border:1.5px solid #fcc}

.empty-hint{font-size:12px;color:#bbb}
@media(min-width:480px){.tab-btn{font-size:14px;padding:9px 4px}}
</style>
</head>
<body>

<div id="authScreen" class="auth-screen">
  <h1>⏱️</h1>
  <div class="subtitle">习惯时间追踪</div>
  <div class="auth-card">
    <div class="auth-error" id="authError"></div>
    <input type="text" id="authUsername" placeholder="用户名" autocomplete="username" maxlength="30">
    <input type="password" id="authPassword" placeholder="密码" autocomplete="current-password" maxlength="50">
    <input type="text" id="authNickname" placeholder="昵称（选填）" autocomplete="off" maxlength="20" class="hidden">
    <button class="btn-auth" id="btnAuth" type="button" onclick="doAuth()">登 录</button>
    <div class="switch-mode">
      <span id="switchText">还没有账户？</span> <a id="switchLink" onclick="switchMode()" style="cursor:pointer;color:#1a1a2e;font-weight:600;text-decoration:underline">立即注册</a>
    </div>
  </div>
</div>

<div id="appContainer" class="app hidden">
  <div class="user-menu">
    <div class="user-avatar" id="userAvatar"></div><span class="user-name" id="userDisplay"></span>
    <span class="sync-status"><span class="sync-dot online" id="syncDot"></span> <span id="syncText">云端</span></span>
    <button class="btn-logout" id="btnLogout" type="button" onclick="doLogout()">退出</button>
  </div>
  <div class="offline-banner" id="offlineBanner">📡 离线 — 数据已保存到本地，联网后自动同步</div>

  <nav class="tab-nav">
    <button class="tab-btn active" data-tab="record">📝 记录</button>
    <button class="tab-btn" data-tab="calendar">📅 日历</button>
    <button class="tab-btn" data-tab="stats">📊 统计</button>
    <button class="tab-btn" data-tab="projects">📂 项目</button>
    <button class="tab-btn" data-tab="manage">⚙️ 管理</button>
  </nav>

  <div id="panel-record" class="panel active">
    <div class="running-banner" id="runningBanner">
      <div class="rb-dot" id="rbDot"></div><div class="rb-info"><div class="rb-cat" id="rbCat"></div><div class="rb-timer" id="rbTimer">00:00</div></div>
      <button class="rb-stop" type="button" onclick="stopRunning()">⏹ 结束</button>
    </div>
    <div class="cat-grid" id="catGrid"></div>
    <div class="timeline" id="timeline"></div>
  </div>

  <div id="panel-calendar" class="panel">
    <div class="cal-header">
      <button type="button" onclick="calShift(-1)">‹</button><div class="date-title" id="calTitle"></div><button type="button" onclick="calShift(1)">›</button>
      <button class="btn-today" type="button" onclick="calGoToday()">今天</button>
      <button class="btn-addcal" type="button" onclick="calAddEntry(-1)">+</button>
    </div>
    <div class="cal-day-total" id="calTotal"></div>
    <div class="cal-grid" id="calGrid"></div>
    <div class="empty-hint" style="padding:20px;text-align:center" id="calEmpty">这一天没有记录</div>
  </div>

  <div id="panel-stats" class="panel">
    <div class="stats-range" id="statsRange">
      <button data-range="day" class="active">日</button><button data-range="week">周</button><button data-range="month">月</button><button data-range="year">年</button>
    </div>
    <div class="stats-summary" id="statsSummary"></div>
    <div class="stats-charts">
      <div class="chart-box"><h4>时间占比</h4><div class="chart-inner"><canvas id="pieChart"></canvas></div></div>
      <div class="chart-box"><h4>各分类时长对比</h4><div class="chart-inner bar"><canvas id="barChart"></canvas></div></div>
    </div>
  </div>

  <div id="panel-projects" class="panel">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
      <h3 style="font-size:15px">📂 我的项目</h3>
      <button class="btn-secondary" type="button" onclick="openProjectDetail()" style="font-size:12px;padding:7px 12px">+ 新建</button>
    </div>
    <div class="proj-list" id="projList"></div>
  </div>

  <div id="panel-manage" class="panel">
    <div class="section-title">我的模块</div>
    <div class="cat-list" id="catList"></div>
    <div class="btn-row-manage">
      <button class="btn-primary" type="button" onclick="openCatModal()">+ 添加新模块</button>
      <button class="btn-secondary" type="button" onclick="exportData()">导出数据</button>
      <button class="btn-secondary" type="button" onclick="document.getElementById('importFile').click()">导入数据</button>
    </div>
    <input type="file" id="importFile" accept=".json" style="display:none" onchange="handleImport(event)">
  </div>
</div>

<div class="modal-overlay" id="modalOverlay" onclick="if(event.target===this)closeStopModal()"><div class="modal">
  <h3 id="modalTitle"></h3><div class="modal-duration" id="modalDuration"></div><div class="modal-time-info" id="modalTimeInfo"></div>
  <div class="form-group"><label>做了什么（可选）</label><textarea id="recordDesc" placeholder="简单记录…"></textarea></div>
  <div class="btn-row"><button class="btn-discard" type="button" onclick="closeStopModal()">丢弃</button><button class="btn-primary" type="button" onclick="saveStopRecord()">保存</button></div>
</div></div>

<div class="modal-overlay" id="catModalOverlay" onclick="if(event.target===this)closeCatModal()"><div class="modal">
  <h3 id="catModalTitle">添加新模块</h3>
  <div class="form-group"><label>模块名称</label><input type="text" id="catName" placeholder="例如：冥想、练琴…"></div>
  <div class="form-group"><label>图标</label><input type="text" id="catIcon" placeholder="例如：🧘"></div>
  <div class="form-group"><label>颜色</label><input type="color" id="catColor" value="#4a90d9" style="height:36px;width:100%;padding:3px"></div>
  <div class="btn-row"><button class="btn-primary" type="button" onclick="saveCat()">保存</button><button class="btn-cancel" type="button" onclick="closeCatModal()">取消</button></div>
</div></div>

<div class="modal-overlay" id="cardOptOverlay" onclick="if(event.target===this)closeCardOpt()"><div class="modal" style="text-align:center">
  <h3 id="cardOptTitle"></h3>
  <div style="display:flex;gap:12px;margin-top:16px">
    <button type="button" onclick="cardStartTimer()" style="flex:1;padding:20px;border-radius:14px;border:1.5px solid #e0e0e0;background:#fff;cursor:pointer;font-size:16px">⏱<br><b>计时</b><br><span style="font-size:12px;color:#888">完成后自动记录</span></button>

function fmtDate(d){return d.getFullYear()+'年'+(d.getMonth()+1)+'月'+d.getDate()+'日 周'+WEEKDAYS[d.getDay()?d.getDay()-1:6]}
function renderCalendar(){
  document.getElementById('calTitle').textContent=fmtDate(calDate);
  const grid=document.getElementById('calGrid'),start=new Date(calDate);start.setHours(0,0,0,0);const end=new Date(calDate);end.setHours(23,59,59,999);const sm=start.getTime(),em=end.getTime(),calDateStr=calDate.toISOString().slice(0,10);
  const events=[];
  records.forEach(r=>{const st=new Date(r.start_time).getTime(),et=new Date(r.end_time).getTime();if(st>=sm&&et<=em){const c=categories.find(x=>x.id===r.category_id)||{};events.push({title:(c.icon||'')+' '+(c.name||'未知'),start:st,end:et,color:c.color||'#aaa',desc:r.description,type:'record'})}});
  projects.forEach(p=>{if(p.calendar_slots&&Array.isArray(p.calendar_slots))p.calendar_slots.forEach(s=>{const st=new Date(s.date+'T'+s.startTime).getTime(),et=new Date(s.date+'T'+s.endTime).getTime();if(st>=sm&&et<=em)events.push({title:'📌 '+p.title,start:st,end:et,color:'#1a1a2e',desc:s.note||'',type:'project',projId:p.id})})});
  const todayDow=calDate.getDay(),todayDow1=todayDow===0?7:todayDow;
  const flexProjs=projects.filter(p=>p.status==='active'&&p.show_on_calendar!==false&&p.frequency_days&&Array.isArray(p.frequency_days)&&p.frequency_days.includes(todayDow1)&&!(p.calendar_slots&&Array.isArray(p.calendar_slots)&&p.calendar_slots.some(s=>s.date===calDateStr)));
  let flexHtml='';if(flexProjs.length>0){flexHtml='<div class="cal-flex-tasks">';flexProjs.forEach(p=>{const ms=p.milestones||[];const done=ms.filter(m=>m.completed).length;flexHtml+=`<div class="cal-flex-item" onclick="openProjectDetail('${p.id}')"><span>📂</span><span style="flex:1;font-weight:500">${escHtml(p.title)}</span><span style="color:#888">${p.duration_per_session||1}h</span><span style="color:#888">${done}/${ms.length}</span></div>`});flexHtml+='</div>'}
  let totalMs=0;events.forEach(e=>totalMs+=e.end-e.start);document.getElementById('calTotal').textContent='总时长：'+fmtDuration(totalMs);
  let html=flexHtml;for(let hour=0;hour<24;hour++){const hStart=hour*3600000+sm,hEnd=(hour+1)*3600000+sm;const hourEvents=events.filter(e=>e.start<hEnd&&e.end>hStart);
    html+=`<div class="cal-hour"><div class="cal-hour-label">${String(hour).padStart(2,'0')}:00</div><div class="cal-hour-content" data-hour="${hour}" onclick="calSlotClick(event,${hour})">`;
    hourEvents.forEach(e=>{const top=Math.max(0,(e.start-hStart)/3600000*44),hgt=Math.max(6,(Math.min(hEnd,e.end)-Math.max(hStart,e.start))/3600000*44);

  grid.innerHTML=html;document.getElementById('calEmpty').style.display=(events.length===0&&flexProjs.length===0)?'block':'none'}
function calEventClick(type,projId,desc){if(desc)alert(desc);if(type==='project'&&projId)openProjectDetail(projId)}
function calSlotClick(e,hour){if(e.target.classList.contains('cal-event')||e.target.closest('.cal-event'))return;calAddEntry(hour)}
function calAddEntry(hour){const cd=calDate,now=new Date();let st,ed;if(hour>=0){st=new Date(cd);st.setHours(hour,0,0,0);ed=new Date(cd);ed.setHours(hour+1,0,0,0)}else{st=new Date(now);st.setMinutes(0,0,0);ed=new Date(now);ed.setHours(ed.getHours()+1,0,0,0)}document.getElementById('calAddStart').value=toLocalISO(st);document.getElementById('calAddEnd').value=toLocalISO(ed);document.getElementById('calAddDesc').value='';let pk='';categories.forEach(c=>{pk+=`<div style="padding:7px 12px;border-radius:8px;background:${c.color};color:#fff;cursor:pointer;font-size:13px" onclick="selectCalCat('${c.id}',this)">${c.icon} ${c.name}</div>`});document.getElementById('calCatPicker').innerHTML=pk;document.getElementById('calAddOverlay')._selCat=null;document.getElementById('calAddOverlay').classList.add('show')}
function selectCalCat(id,el){document.querySelectorAll('#calCatPicker div').forEach(d=>d.style.outline='');el.style.outline='3px solid #1a1a2e';document.getElementById('calAddOverlay')._selCat=id}
function closeCalAdd(){document.getElementById('calAddOverlay').classList.remove('show')}
function toLocalISO(d){const tz=d.getTimezoneOffset();return new Date(d.getTime()-tz*60000).toISOString().slice(0,16)}
async function saveCalAdd(){const cid=document.getElementById('calAddOverlay')._selCat;if(!cid)return alert('请选模块');const st=document.getElementById('calAddStart').value,et=document.getElementById('calAddEnd').value;if(!st||!et)return;if(new Date(st).getTime()>=new Date(et).getTime())return alert('结束需晚于开始');const rec={id:uid(),username:currentUser.username,category_id:cid,start_time:new Date(st).toISOString(),end_time:new Date(et).toISOString(),description:document.getElementById('calAddDesc').value.trim()};records.unshift(rec);localSet(userKey('records'),records);
  if(isOnline())try{setStatus('syncing');await sbPost('records',rec);setStatus('online')}catch(e){setStatus('offline');addPending({table:'records',action:'insert',data:rec,id:rec.id});document.getElementById('offlineBanner').classList.add('show')}
  else{setStatus('offline');addPending({table:'records',action:'insert',data:rec,id:rec.id});document.getElementById('offlineBanner').classList.add('show')}closeCalAdd();renderAll()}

// ═══════════════ Stats ═══════════════
function renderStats(){if(!document.getElementById('panel-stats').classList.contains('active'))return;const{start,end}=getRangeDates(activeRange);const fr=records.filter(r=>{const t=new Date(r.start_time).getTime();return t>=start&&t<=end});const cm={};categories.forEach(c=>{cm[c.id]={name:c.name,color:c.color,total:0}});let tm=0;fr.forEach(r=>{const d=new Date(r.end_time).getTime()-new Date(r.start_time).getTime();if(d>0&&cm[r.category_id]){cm[r.category_id].total+=d;tm+=d}});const ents=Object.entries(cm).filter(([_,v])=>v.total>0),lbs=ents.map(([_,v])=>v.name),dt=ents.map(([_,v])=>v.total),cls=ents.map(([_,v])=>v.color);document.getElementById('statsSummary').innerHTML=`<div class="stat-item"><div class="val">${fmtDuration(tm)}</div><div class="lbl">总时长</div></div><div class="stat-item"><div class="val">${ents.length}</div><div class="lbl">活跃模块</div></div><div class="stat-item"><div class="val">${fr.length}</div><div class="lbl">记录条数</div></div>`;if(pieChart)pieChart.destroy();if(barChart)barChart.destroy();const pc=document.getElementById('pieChart').getContext('2d'),bc=document.getElementById('barChart').getContext('2d');if(ents.length===0){pieChart=new Chart(pc,{type:'doughnut',data:{labels:['暂无数据'],datasets:[{data:[1],backgroundColor:['#eee']}]},options:{plugins:{legend:{display:false}}}});barChart=new Chart(bc,{type:'bar',data:{labels:['暂无数据'],datasets:[{data:[0],backgroundColor:['#eee']}]},options:{plugins:{legend:{display:false}},scales:{y:{beginAtZero:true}}}});return}pieChart=new Chart(pc,{type:'doughnut',data:{labels:lbs,datasets:[{data:dt,backgroundColor:cls,borderWidth:2,borderColor:'#fff'}]},options:{plugins:{legend:{position:'bottom',labels:{padding:16,usePointStyle:true}},tooltip:{callbacks:{label:ctx=>` ${ctx.label}: ${fmtDuration(ctx.raw)} (${((ctx.raw/tm)*100).toFixed(1)}%)`}}}}});barChart=new Chart(bc,{type:'bar',data:{labels:lbs,datasets:[{label:'时长(分钟)',data:dt.map(d=>Math.round(d/60000)),backgroundColor:cls,borderRadius:6}]},options:{plugins:{legend:{display:false}},scales:{y:{beginAtZero:true,title:{display:true,text:'分钟'}},x:{ticks:{maxRotation:45}}},animation:{duration:300}})}

// ═══════════════ Projects ═══════════════
function projProgress(p){const ms=p.milestones||[];if(ms.length===0)return p.status==='done'?100:0;return Math.round(ms.filter(m=>m.completed).length/ms.length*100)}
function renderProjList(){const list=document.getElementById('projList'),active=projects.filter(p=>p.status!=='done'),done=projects.filter(p=>p.status==='done');if(projects.length===0){list.innerHTML='<div class="empty-hint" style="padding:20px;text-align:center">暂无项目，点右上角「+ 新建」创建</div>';return}let h='';active.forEach(p=>{const pp=projProgress(p),fre=p.frequency_days||[1,2,3,4,5];h+=`<div class="proj-card" onclick="openProjectDetail('${p.id}')"><div class="proj-header"><div class="proj-title">${escHtml(p.title)}</div><span class="proj-status p-status ${p.status}">${p.status==='active'?'进行中':'暂停'}</span></div><div class="proj-bar"><div class="proj-bar-fill" style="width:${pp}%;background:${pp<30?'#e74c3c':pp<70?'#f0ad4e':'#5cb85c'}"></div></div><div class="proj-meta"><span>进度 ${pp}%</span><span>截止 ${(p.end_date||'').slice(0,10)}</span><span>每次 ${p.duration_per_session||1}h</span></div><div class="proj-freq">${WEEKDAYS.map((d,i)=>`<div class="d${fre.includes(i+1)?' on':''}">${d}</div>`).join('')}</div></div>`});done.forEach(p=>{h+=`<div class="proj-card" onclick="openProjectDetail('${p.id}')" style="opacity:.6"><div class="proj-header"><div class="proj-title">✓ ${escHtml(p.title)}</div><span class="proj-status p-status done">已完成</span></div><div class="proj-bar"><div class="proj-bar-fill" style="width:100%;background:#5cb85c"></div></div></div>`});list.innerHTML=h}
function openProjectDetail(projId){editingProjId=projId||null;let p={title:'',description:'',start_date:new Date().toISOString().slice(0,10),end_date:new Date(Date.now()+30*86400000).toISOString().slice(0,10),frequency_days:[1,2,3,4,5],duration_per_session:1,show_on_calendar:true,milestones:[],status:'active'};if(projId){const f=projects.find(x=>x.id===projId);if(f)p={...p,...f}}const fre=p.frequency_days||[];let daySel='';WEEKDAYS.forEach((d,i)=>{daySel+=`<label class="${fre.includes(i+1)?'on':''}"><input type="checkbox" value="${i+1}" ${fre.includes(i+1)?'checked':''} onchange="this.parentElement.classList.toggle('on',this.checked)">${d}</label>`});const ms=p.milestones||[];let msHtml='<div class="milestone-list">';ms.forEach((m,i)=>{msHtml+=`<div class="milestone-item${m.completed?' done':''}"><input type="checkbox" ${m.completed?'checked':''} onchange="toggleProjMS(${i})"><span class="ms-title">${escHtml(m.title)}</span><button class="milestone-del" onclick="deleteProjMS(${i})">×</button></div>`});msHtml+='</div>';document.getElementById('projDetailContent').innerHTML=`<h3>${projId?'编辑项目':'新建项目'}</h3><div class="pr"><label>标题</label><input id="pdTitle" value="${escHtml(p.title)}"></div><div class="pr"><label>描述</label><input id="pdDesc" value="${escHtml(p.description||'')}"></div><div class="pr"><label>开始</label><input type="date" id="pdStart" value="${(p.start_date||'').slice(0,10)}"> <label>截止</label><input type="date" id="pdEnd" value="${(p.end_date||'').slice(0,10)}"></div><div class="pr"><label>频率</label><div class="day-picker">${daySel}</div></div><div class="pr"><label>每次</label><input type="number" id="pdDur" value="${p.duration_per_session||1}" step="0.5" min="0" style="width:60px"> <span style="font-size:12px;color:#888">小时</span></div><div class="pr"><label>日历</label><select id="pdCal"><option value="1" ${p.show_on_calendar!==false?'selected':''}>显示</option><option value="0" ${p.show_on_calendar===false?'selected':''}>隐藏</option></select> <label>状态</label><select id="pdStatus"><option value="active" ${p.status==='active'?'selected':''}>进行中</option><option value="paused" ${p.status==='paused'?'selected':''}>暂停</option><option value="done" ${p.status==='done'?'selected':''}>已完成</option></select></div><div style="font-size:13px;font-weight:600;margin:12px 0 6px">📌 里程碑 (${ms.filter(m=>m.completed).length}/${ms.length})</div>${msHtml}<div class="add-ms-row"><input id="pdNewMS" placeholder="新里程碑…"><button onclick="addProjMS()">+ 添加</button></div><div class="btn-row" style="margin-top:14px">${projId?`<button class="btn-discard" onclick="deleteProj('${projId}')">删除项目</button>`:''}<button class="btn-cancel" onclick="closeProjDetail()">取消</button><button class="btn-primary" onclick="saveProj()">保存</button></div>`;document.getElementById('projModalOverlay').classList.add('show');
  document.getElementById('projModalOverlay')._projId=projId;document.getElementById('projModalOverlay')._ms=JSON.parse(JSON.stringify(ms))}
function closeProjDetail(){document.getElementById('projModalOverlay').classList.remove('show');editingProjId=null}
function toggleProjMS(idx){const ms=document.getElementById('projModalOverlay')._ms;if(ms[idx])ms[idx].completed=!ms[idx].completed}
function deleteProjMS(idx){const ms=document.getElementById('projModalOverlay')._ms;ms.splice(idx,1);const projId=document.getElementById('projModalOverlay')._projId;if(projId)openProjectDetail(projId)}
function addProjMS(){const t=document.getElementById('pdNewMS').value.trim();if(!t)return;const ms=document.getElementById('projModalOverlay')._ms;ms.push({title:t,completed:false});const projId=document.getElementById('projModalOverlay')._projId;if(projId)openProjectDetail(projId);document.getElementById('pdNewMS').value=''}
async function saveProj(){const title=document.getElementById('pdTitle').value.trim();if(!title)return alert('请输入项目名称');const days=[];document.querySelectorAll('.day-picker input:checked').forEach(cb=>days.push(parseInt(cb.value)));const ms=document.getElementById('projModalOverlay')._ms||[];const data={title,description:document.getElementById('pdDesc').value.trim(),start_date:document.getElementById('pdStart').value,end_date:document.getElementById('pdEnd').value,frequency_days:days,duration_per_session:parseFloat(document.getElementById('pdDur').value)||0,show_on_calendar:document.getElementById('pdCal').value==='1',milestones:ms,status:document.getElementById('pdStatus').value,username:currentUser.username};
  if(editingProjId){const idx=projects.findIndex(x=>x.id===editingProjId);if(idx>=0)projects[idx]={...projects[idx],...data};localSet(userKey('projects'),projects);if(isOnline())try{await sbPatch('projects',editingProjId,{...data,milestones:JSON.stringify(ms)})}catch(e){addPending({table:'projects',action:'update',id:editingProjId,data:{...data,milestones:JSON.stringify(ms)}})}}
  else{const np={id:uid(),...data};projects.push(np);localSet(userKey('projects'),projects);if(isOnline())try{await sbPost('projects',{...data,id:np.id,milestones:JSON.stringify(ms)})}catch(e){addPending({table:'projects',action:'insert',data:{...data,id:np.id,milestones:JSON.stringify(ms)},id:np.id})}}
  closeProjDetail();renderAll()}
async function deleteProj(id){if(!confirm('删除此项目？'))return;projects=projects.filter(x=>x.id!==id);localSet(userKey('projects'),projects);if(isOnline())try{await sbDelete('projects',id)}catch(e){addPending({table:'projects',action:'delete',id})}closeProjDetail();renderAll()}

// ═══════════════ Category Management ═══════════════
function renderCatList(){const l=document.getElementById('catList');let h='';categories.forEach(c=>{const t=records.filter(r=>r.category_id===c.id).length;h+=`<div class="cat-item"><div class="cat-color" style="background:${c.color}"></div><div class="cat-info"><div class="name">${c.icon} ${c.name}</div><div class="meta">${t} 条记录${c.is_preset?' · 预设':''}</div></div><div class="cat-actions"><button class="btn-edit" onclick="editCat('${c.id}')">编辑</button>${!c.is_preset?`<button class="btn-del" onclick="deleteCat('${c.id}')">删除</button>`:''}</div></div>`});if(categories.length===0)h='<div class="empty-hint" style="padding:20px;text-align:center">暂无模块</div>';l.innerHTML=h}
function openCatModal(catId){editingCatId=catId||null;if(catId){const c=categories.find(x=>x.id===catId);if(!c)return;document.getElementById('catModalTitle').textContent='编辑模块';document.getElementById('catName').value=c.name;document.getElementById('catIcon').value=c.icon;document.getElementById('catColor').value=c.color}else{document.getElementById('catModalTitle').textContent='添加新模块';document.getElementById('catName').value='';document.getElementById('catIcon').value='📌';document.getElementById('catColor').value=PRESET_COLORS[Math.floor(Math.random()*PRESET_COLORS.length)]}document.getElementById('catModalOverlay').classList.add('show')}
function closeCatModal(){document.getElementById('catModalOverlay').classList.remove('show');editingCatId=null}
async function saveCat(){const nm=document.getElementById('catName').value.trim(),ic=document.getElementById('catIcon').value.trim()||'📌',cl=document.getElementById('catColor').value;if(!nm)return alert('请输入名称');if(editingCatId){const c=categories.find(x=>x.id===editingCatId);if(c){c.name=nm;c.icon=ic;c.color=cl}localSet(userKey('categories'),categories);if(isOnline())try{await sbPatch('categories',editingCatId,{name:nm,icon:ic,color:cl})}catch(e){addPending({table:'categories',action:'update',id:editingCatId,data:{name:nm,icon:ic,color:cl}});document.getElementById('offlineBanner').classList.add('show')}else{addPending({table:'categories',action:'update',id:editingCatId,data:{name:nm,icon:ic,color:cl}});document.getElementById('offlineBanner').classList.add('show')}}else{const nc={id:uid(),username:currentUser.username,name:nm,icon:ic,color:cl,is_preset:false};categories.push(nc);localSet(userKey('categories'),categories);if(isOnline())try{await sbPost('categories',nc)}catch(e){addPending({table:'categories',action:'insert',data:nc,id:nc.id});document.getElementById('offlineBanner').classList.add('show')}else{addPending({table:'categories',action:'insert',data:nc,id:nc.id});document.getElementById('offlineBanner').classList.add('show')}}closeCatModal();renderAll()}
function editCat(id){openCatModal(id)}
async function deleteCat(id){const c=categories.find(x=>x.id===id);if(!c||c.is_preset)return;if(!confirm(`删除"${c.name}"？`))return;categories=categories.filter(x=>x.id!==id);localSet(userKey('categories'),categories);if(isOnline())try{await sbDelete('categories',id)}catch(e){addPending({table:'categories',action:'delete',id});document.getElementById('offlineBanner').classList.add('show')}else{addPending({table:'categories',action:'delete',id});document.getElementById('offlineBanner').classList.add('show')}renderAll()}
function exportData(){const d={categories,records,projects};const b=new Blob([JSON.stringify(d,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='habit-tracker-'+new Date().toISOString().slice(0,10)+'.json';a.click()}
function handleImport(e){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=function(ev){try{const d=JSON.parse(ev.target.result);if(d.categories)categories=d.categories;if(d.records)records=d.records;if(d.projects)projects=d.projects;localSet(userKey('categories'),categories);localSet(userKey('records'),records);localSet(userKey('projects'),projects);renderAll();alert('导入成功！')}catch(err){alert('导入失败')}};r.readAsText(f);e.target.value=''}

// ═══════════════ Tabs ═══════════════
function switchTab(tab){document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));document.querySelector(`[data-tab="${tab}"]`).classList.add('active');document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));document.getElementById('panel-'+tab).classList.add('active');if(tab==='stats')renderStats();if(tab==='manage')renderCatList();if(tab==='calendar')renderCalendar();if(tab==='projects')renderProjList()}
document.querySelectorAll('.tab-btn').forEach(b=>b.addEventListener('click',()=>switchTab(b.dataset.tab)));
document.querySelectorAll('#statsRange button').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('#statsRange button').forEach(x=>x.classList.remove('active'));b.classList.add('active');activeRange=b.dataset.range;renderStats()}));
document.addEventListener('keydown',function(e){if(e.key==='Escape'){if(document.getElementById('modalOverlay').classList.contains('show'))closeStopModal();if(document.getElementById('catModalOverlay').classList.contains('show'))closeCatModal();if(document.getElementById('projModalOverlay').classList.contains('show'))closeProjDetail();if(document.getElementById('calAddOverlay').classList.contains('show'))closeCalAdd();if(document.getElementById('cardOptOverlay').classList.contains('show'))closeCardOpt()}});
window.addEventListener('online',()=>{if(currentUser){setStatus('syncing');syncPending().then(()=>{if(getPending().length===0)setStatus('online')})}});
window.addEventListener('offline',()=>{if(currentUser){setStatus('offline');document.getElementById('offlineBanner').classList.add('show')}});

// ═══════════════ Init ═══════════════
(function(){const su=sessionStorage.getItem('ht_currentUser');if(su){try{currentUser=JSON.parse(su);document.getElementById('authScreen').classList.add('hidden');document.getElementById('appContainer').classList.remove('hidden');document.getElementById('userAvatar').textContent=(currentUser.nickname||currentUser.username)[0].toUpperCase();document.getElementById('userDisplay').textContent=currentUser.nickname||currentUser.username;initApp()}catch(e){currentUser=null}}if(!isOnline()&&currentUser){setStatus('offline');document.getElementById('offlineBanner').classList.add('show')}})();
</script>
</body>
